name: mywhoosh-sync-coros
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,13,16,22 * * *'
env:
  GITHUB_NAME: Mathblais01
  GITHUB_EMAIL: mathblais01@gmail.com
  ## MyWhoosh config
  MYWHOOSH_EMAIL: ${{ secrets.MYWHOOSH_EMAIL }}
  MYWHOOSH_PASSWORD: ${{ secrets.MYWHOOSH_PASSWORD }}
  ## COROS config
  COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
  COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      - name: Set Variables
        id: set_variables
        run: |
          echo "PY=$(python -c 'import hashlib, sys;print(hashlib.sha256(sys.version.encode()+sys.executable.encode()).hexdigest())')" >> $GITHUB_OUTPUT
          echo "PIP_CACHE=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: Cache PIP
        uses: actions/cache@v3
        with:
          path: ${{ steps.set_variables.outputs.PIP_CACHE }}
          key: Ubuntu-pip-${{ steps.set_variables.outputs.PY }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run MyWhoosh Sync to COROS
        run: |
          python scripts/mywhoosh/mywhoosh_sync_coros.py
      - name: Push updates
        run: |
          git config --local user.email "${{ env.GITHUB_EMAIL }}"
          git config --local user.name "${{ env.GITHUB_NAME }}"
          git add .
          git commit -m 'update mywhoosh activity sync' || echo "nothing to commit"
          git push || echo "nothing to push"
